function addPoints(n, fromEl) {
  progress.points += n;
  if (fromEl && !reduceMotion) { const r = fromEl.getBoundingClientRect(), t = $id("pts").getBoundingClientRect(); const c = document.createElement("span"); c.className = "coin fly"; c.style.left = `${r.left + 20}px`; c.style.top = `${r.top + 10}px`; document.body.append(c); requestAnimationFrame(() => { c.style.transform = `translate(${t.left - r.left - 10}px, ${t.top - r.top - 4}px) scale(.8)`; c.style.opacity = .4; }); setTimeout(() => { c.remove(); paintPoints(true); sfx("coin"); }, 800); }
  else paintPoints(true);
}
function openShop() {
  openSheet(`<div class="stack"><div class="headrow">${MASCOT("happy")}<div><h2>集點換獎</h2><p>你有 <b style="color:var(--butter-d);font-weight:400">${progress.points}</b> 點。在書桌答對題目就能賺點數。</p></div></div>
    <div class="shop">${PRIZES.map(p => { const own = owns(p.id); return `<div class="prize${own ? " owned" : ""}"><div class="em">${p.em}</div><div class="nm">${p.nm}</div><div class="ds">${p.ds}</div>${own ? `<div class="dim">已擁有</div>` : `<div class="cost">${coinI(14)}${p.cost}</div><button class="btn${progress.points < p.cost ? " ghost" : ""}" data-id="${p.id}" ${progress.points < p.cost ? "disabled" : ""}>兌換</button>`}</div>`; }).join("")}</div></div>`);
  sheet.querySelectorAll("[data-id]").forEach(b => b.onclick = () => buy(b.dataset.id));
}
function buy(id) { const p = PRIZES.find(x => x.id === id); if (!p || progress.points < p.cost || owns(id)) return; progress.points -= p.cost; progress.owned.push(id); paintPoints(true); applyOwned(); saveProgress(); sfx("chime"); toast(`兌換成功：${p.nm}！`); openShop(); }

/* ---------- saving: same place and format as before, plus today's tasks ---------- */
let DB = null;
async function loadProgress() {
  try { DB = window.claude && window.claude.use ? await Promise.race([window.claude.use("db"), sleep(10000).then(() => null)]) : null; } catch (e) { DB = null; }
  try {
    if (DB) { const snap = await DB.collection("progress").doc("me").get(); const d = snap && snap.data && snap.data(); if (d) progress = Object.assign(progress, d); }
    else { const raw = localStorage.getItem("office-progress"); if (raw) progress = Object.assign(progress, JSON.parse(raw)); }
  } catch (e) {}
  progress.last = progress.last || {}; progress.stats = progress.stats || {}; progress.owned = progress.owned || [];
  paintPoints(false); applyOwned(); refreshTags();
}
let saveT = 0;
function saveProgress() { clearTimeout(saveT); saveT = setTimeout(async () => { const data = { points: progress.points, owned: progress.owned, stats: progress.stats, daily: progress.daily, last: progress.last, updated: new Date().toISOString() }; try { if (DB) await DB.collection("progress").doc("me").set(data); else localStorage.setItem("office-progress", JSON.stringify(data)); } catch (e) { toast("進度暫時沒有存到"); } }, 400); }

/* ---------- sound ---------- */
let AC = null, soundOn = true;
function sfx(type) {
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime, tone = (f0, f1, d, wave, vol, at = 0) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = wave; o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(f1, t + at + d); g.gain.setValueAtTime(vol, t + at); g.gain.exponentialRampToValueAtTime(.0008, t + at + d); o.connect(g).connect(AC.destination); o.start(t + at); o.stop(t + at + d + .02); };
    if (type === "tick") tone(1300, 1000, .05, "triangle", .05);
    if (type === "ding") { tone(880, 880, .2, "sine", .08); tone(1320, 1320, .3, "sine", .07, .1); }
    if (type === "buzz") tone(320, 200, .22, "triangle", .06);
    if (type === "coin") { tone(1568, 1568, .08, "square", .03); tone(2093, 2093, .2, "square", .03, .07); }
    if (type === "chime") [784, 988, 1318, 1568].forEach((f, i) => tone(f, f, .4, "sine", .06, i * .08));
  } catch (e) {}
}
$id("fs").onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { toast("這個畫面不支援全螢幕，可以把手機轉橫看看"); } setTimeout(resize, 300); };
if (!document.fullscreenEnabled) $id("fs").hidden = true;
$id("snd").onclick = () => { soundOn = !soundOn; $id("snd").textContent = soundOn ? "🔊" : "🔇"; };
$id("wx").onclick = () => { const i = WEATHERS.findIndex(x => x.id === weather), W = WEATHERS[(i + 1) % WEATHERS.length]; setWeather(W.id, true); toast(`窗外變成${W.nm}了`); };
const DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
function tickClock() { const d = new Date(); $id("clock").textContent = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; $id("dayname").textContent = DAYS[d.getDay()]; }

/* ---------- boot ---------- */
(async () => {
  tickClock(); setInterval(tickClock, 15000);
  try { await loadAll(p => { $id("loadBar").style.width = `${Math.round(p * 100)}%`; }); }
  catch (e) { $id("loadT").textContent = "圖片載入失敗，請重新整理一次"; return; }
  rebuildGrid(); resize(); vcx = cat.x; vcy = cat.y - 90; clampView();
  refreshTags(); $id("loading").hidden = true; last = performance.now(); requestAnimationFrame(loop);
  await loadProgress();
  toast("喵～點書桌，貓咪就會走過去坐下來練習");
})();
</script>
